name: Build Windows DesktopPet

on:
  workflow_dispatch:
  push:
    branches:
      - backup-shop-ui-20260730

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows application
        run: pyinstaller --noconfirm --clean DesktopPet.spec

      - name: Create distributable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/DesktopPet" `
            -DestinationPath "dist/DesktopPet-Windows.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: DesktopPet-Windows
          path: dist/DesktopPet-Windows.zip
          if-no-files-found: error
          retention-days: 30
